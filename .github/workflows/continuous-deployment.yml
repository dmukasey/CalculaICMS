name: Continuous Integration, Delivery and Deployment with Github Actions and .NET 8

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore Dependencies
      run: dotnet restore CalculaICMS.sln
      working-directory: CalculaICMS
    
    - name: Build ASP.NET 8 App
      run: dotnet build CalculaICMS.sln --configuration Release --no-restore
      working-directory: CalculaICMS
    
